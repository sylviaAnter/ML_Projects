[project]
name = "ml-projects-courses"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sylvia Anter", email = "silviaa.zakria@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "matplotlib-inline>=0.2.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pygments>=2.21.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sklearn-features>=0.0.2",
]

[project.scripts]
ml-projects-courses = "ml_projects_courses:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
